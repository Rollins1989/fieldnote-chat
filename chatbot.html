<style>
  :root {
    --bg: #F6F5F1;
    --surface: #FFFFFF;
    --ink: #20232A;
    --ink-soft: #6B6F76;
    --ink-faint: #9DA1A8;
    --accent: #2F6F5E;
    --accent-dark: #1F4E42;
    --accent-soft: #E4EEEA;
    --line: #E4E2DB;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  .cw-root {
    font-family: -apple-system, "Inter", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    height: 640px;
    max-height: 85vh;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid var(--line);
  }

  .cw-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 22px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    flex-shrink: 0;
  }

  .cw-brand { display: flex; align-items: center; gap: 10px; }

  .cw-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent); flex-shrink: 0;
  }

  .cw-title {
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 18px; font-weight: 600; letter-spacing: -0.01em;
  }

  .cw-sub { font-size: 12px; color: var(--ink-faint); }

  .cw-reset {
    font-size: 12.5px;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .cw-reset:hover { border-color: var(--accent); color: var(--accent-dark); }

  .cw-messages {
    flex: 1;
    overflow-y: auto;
    padding: 26px 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .cw-empty {
    margin: auto;
    text-align: center;
    color: var(--ink-faint);
    max-width: 320px;
    font-size: 14px;
    line-height: 1.6;
  }
  .cw-empty strong { color: var(--ink-soft); display: block; margin-bottom: 6px; font-size: 15px; }

  .cw-row { display: flex; }
  .cw-row.user { justify-content: flex-end; }
  .cw-row.assistant { justify-content: flex-start; }

  .cw-bubble-user {
    background: var(--accent-dark);
    color: #FBFAF7;
    padding: 11px 16px;
    border-radius: 18px 18px 4px 18px;
    max-width: 78%;
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .cw-assistant-block { display: flex; gap: 12px; max-width: 84%; }

  .cw-avatar {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--accent-soft);
    border: 1px solid var(--line);
    flex-shrink: 0;
    margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
  }
  .cw-avatar span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  .cw-assistant-text {
    font-size: 14.5px;
    line-height: 1.65;
    color: var(--ink);
    border-left: 2px solid var(--line);
    padding-left: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .cw-assistant-text code {
    background: var(--accent-soft);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 13px;
    font-family: "SF Mono", Menlo, monospace;
  }

  .cw-typing {
    display: flex; gap: 4px;
    padding-left: 14px;
    border-left: 2px solid var(--line);
    align-items: center;
    height: 20px;
  }
  .cw-typing span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--ink-faint);
    animation: cw-bounce 1.1s infinite ease-in-out;
  }
  .cw-typing span:nth-child(2) { animation-delay: 0.15s; }
  .cw-typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes cw-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .cw-error {
    font-size: 13px;
    color: #9B4B3E;
    background: #FBEDEA;
    border: 1px solid #EFCFC7;
    border-radius: 10px;
    padding: 10px 14px;
    max-width: 84%;
  }

  .cw-inputbar {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid var(--line);
    background: var(--surface);
    flex-shrink: 0;
  }

  .cw-input {
    flex: 1;
    resize: none;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 14px;
    font-size: 14.5px;
    font-family: inherit;
    color: var(--ink);
    background: var(--bg);
    max-height: 120px;
    line-height: 1.5;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .cw-input:focus { border-color: var(--accent); }

  .cw-send {
    background: var(--accent-dark);
    color: #FBFAF7;
    border: none;
    border-radius: 12px;
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, opacity 0.15s ease;
  }
  .cw-send:hover:not(:disabled) { background: var(--accent); }
  .cw-send:disabled { opacity: 0.4; cursor: default; }

  .cw-messages::-webkit-scrollbar { width: 8px; }
  .cw-messages::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
</style>

<div class="cw-root">
  <div class="cw-header">
    <div class="cw-brand">
      <div class="cw-dot"></div>
      <div>
        <div class="cw-title">Fieldnote</div>
        <div class="cw-sub">a small, focused assistant</div>
      </div>
    </div>
    <button class="cw-reset" id="cw-reset">Clear chat</button>
  </div>

  <div class="cw-messages" id="cw-messages">
    <div class="cw-empty" id="cw-empty">
      <strong>Ask me anything.</strong>
      This is a live chat, backed by a free open-source model — try a question, a draft, or a problem you're stuck on.
    </div>
  </div>

  <div class="cw-inputbar">
    <textarea class="cw-input" id="cw-input" rows="1" placeholder="Message Fieldnote..."></textarea>
    <button class="cw-send" id="cw-send" aria-label="Send message">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M4 12L20 4L13 20L11 13L4 12Z" fill="currentColor"/>
      </svg>
    </button>
  </div>
</div>

<script>
(function() {
  // ---------------------------------------------------------------
  // IMPORTANT: replace this with YOUR deployed Cloudflare Worker URL
  // (see worker.js + README.md in this same download).
  // Example: "https://fieldnote-chat.yourname.workers.dev"
  // ---------------------------------------------------------------
  const BACKEND_URL = "https://fieldnote-chat.nanotechnology728.workers.dev";

  const messagesEl = document.getElementById('cw-messages');
  const emptyEl = document.getElementById('cw-empty');
  const inputEl = document.getElementById('cw-input');
  const sendBtn = document.getElementById('cw-send');
  const resetBtn = document.getElementById('cw-reset');

  let history = []; // { role, content }
  let busy = false;

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function formatText(raw) {
    let safe = escapeHtml(raw);
    safe = safe.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    safe = safe.replace(/`([^`]+?)`/g, '<code>$1</code>');
    return safe;
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addUserBubble(text) {
    if (emptyEl) emptyEl.remove();
    const row = document.createElement('div');
    row.className = 'cw-row user';
    const bubble = document.createElement('div');
    bubble.className = 'cw-bubble-user';
    bubble.textContent = text;
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function addAssistantBlock() {
    const row = document.createElement('div');
    row.className = 'cw-row assistant';
    const block = document.createElement('div');
    block.className = 'cw-assistant-block';
    const avatar = document.createElement('div');
    avatar.className = 'cw-avatar';
    avatar.innerHTML = '<span></span>';
    const textEl = document.createElement('div');
    textEl.className = 'cw-assistant-text';
    const typing = document.createElement('div');
    typing.className = 'cw-typing';
    typing.innerHTML = '<span></span><span></span><span></span>';
    textEl.appendChild(typing);
    block.appendChild(avatar);
    block.appendChild(textEl);
    row.appendChild(block);
    messagesEl.appendChild(row);
    scrollToBottom();
    return textEl;
  }

  function addErrorBubble(msg) {
    const row = document.createElement('div');
    row.className = 'cw-row assistant';
    const err = document.createElement('div');
    err.className = 'cw-error';
    err.textContent = msg;
    row.appendChild(err);
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || busy) return;

    busy = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    addUserBubble(text);
    history.push({ role: 'user', content: text });

    const textEl = addAssistantBlock();

    try {
      const response = await fetch(BACKEND_URL + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          system: "You are a warm, sharp, and concise assistant. Give direct, useful answers. Use plain language, avoid unnecessary hedging, and keep responses tight unless the user asks for depth.",
          messages: history
        })
      });

      if (!response.ok) {
        throw new Error("Request failed (" + response.status + ")");
      }

      const data = await response.json();
      const reply = (data.reply || "").trim();

      textEl.innerHTML = formatText(reply || "(no response)");
      history.push({ role: 'assistant', content: reply || "" });
      scrollToBottom();
    } catch (err) {
      textEl.closest('.cw-row').remove();
      addErrorBubble("Something went wrong reaching the model. " + (err.message || "") + " (Check that BACKEND_URL in the script is set to your deployed worker.)");
      history.pop();
    } finally {
      busy = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  resetBtn.addEventListener('click', () => {
    history = [];
    messagesEl.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'cw-empty';
    div.innerHTML = '<strong>Ask me anything.</strong>This is a live chat, backed by a free open-source model — try a question, a draft, or a problem you\'re stuck on.';
    messagesEl.appendChild(div);
  });
})();
</script>
